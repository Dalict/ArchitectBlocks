# ArchitectBlocks 配置
# 作者: Dalict
# 物品列表随服务器版本自动更新
# 开关、名单、玩家界面状态、自定义物品存储在数据库中，游戏内 /mats admin 实时管理

# 配置版本号（插件自动升级配置时使用，请勿手动修改）
config-version: 3

# 访问控制：默认 指定玩家名单 或 拥有 architectblocks.use/admin 权限 的玩家可用
# 玩家名单存放在独立的 players.yml，用 /mats add|remove <玩家名> 管理
access:
  # 全局允许所有人使用（开启后无视名单与权限）
  allow-everyone: false
  # 启用玩家名单（关闭后名单失效，仅剩权限节点判定）
  use-player-list: true

# 内置快捷物品：授权玩家加入时自动发放，点击打开菜单（不可放置）
quick-item:
  enabled: true
  material: GRASS_BLOCK

settings:
  # 每次点击获取的物品数量 (1-64)
  click-amount: 64
  # 取物冷却（毫秒），0 = 无冷却，默认 1 秒
  give-cooldown-ms: 1000
  # 排序方式: type=按种类(家族聚簇，接近创造栏观感) / alphabetical=按字母顺序
  sort: type
  # 聊天搜索输入的超时秒数，超时后会话自动失效
  chat-timeout-seconds: 30

# 搜索：可搜索语言（支持多个），启动时自动从官方源下载到 plugins/ArchitectBlocks/lang/
# 英文ID、英文名(en_us自动下载)始终可搜索；语言文件不打包进插件，随服务器版本自动更新
search:
  languages: [zh_cn]
  # 下载源: auto(国内镜像BMCLAPI优先，失败回退Mojang官方) / bmclapi / mojang
  mirror: auto

# 数据库：开关设置、黑白名单、玩家界面状态、语言缓存、自定义物品
database:
  # sqlite 或 mysql
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    database: architectblocks
    user: root
    password: ''
    use-ssl: false

# GUI 界面配置
# 主界面布局: 0 关闭 | 1 管理员设置(仅管理员可见) | 4 搜索时显示关键词 | 8 搜索或返回
