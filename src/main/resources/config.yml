# ArchitectBlocks 主配置
# 作者: Dalict
# 显示文本（GUI 名称、消息、快捷物品名称/描述）在 lang/zh_CN.yml

# 语言文件（lang/ 文件夹下的文件名，不含 .yml 后缀）
# 修改后 /mats reload 生效
language: zh_CN

# 访问控制
# 菜单与所有功能：architectblocks.admin 或 use 权限 或 全局允许 或 授权名单
# 快捷物品发放（严格）：use 权限 或 全局允许 或 授权名单（admin 不隐式放行）
# 填充工具（独立）：architectblocks.fill 权限 或 授权名单中 allow_fill=1
access:
  # 全局允许所有人使用（开启后无视名单与权限）
  allow-everyone: false
  # 启用数据库授权名单（/mats add 管理）
  use-player-list: true

# 内置快捷物品
quick-item:
  # 总开关
  enabled: true
  # 物品材质
  material: KNOWLEDGE_BOOK
  # 附魔光效（只显示光效不显示附魔文字）
  enchanted: true

settings:
  # 每次点击获取的物品数量 (1-64)
  click-amount: 64
  # 取物冷却（毫秒），0 = 无冷却
  give-cooldown-ms: 1000
  # 排序方式: type=按种类 / alphabetical=按字母
  sort: type
  # 聊天搜索输入的超时秒数
  chat-timeout-seconds: 30
  # 填充工具最大体积（X*Y*Z），超出则拒绝执行
  fill-max-volume: 32768

# 搜索：可搜索语言（Minecraft 语言代码），自动下载官方语言文件
# 英文ID与英文名(en_us)始终可搜索
search:
  languages: [zh_cn]
  # 下载源: auto(BMCLAPI优先回退Mojang) / bmclapi / mojang
  mirror: auto

# 数据库
database:
  # sqlite 或 mysql
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    database: architectblocks
    user: root
    password: ''
    use-ssl: false

# GUI 物品材质（显示文本在语言文件中）
gui:
  # 底排空位是否填充玻璃板
  use-pane: true
  items:
    pane: WHITE_STAINED_GLASS_PANE
    close-button: BARRIER
    back-button: COMPASS
    search-button: COMPASS
    inv-button: HOPPER
    keyword-button: OAK_SIGN
    page-select-button: PAPER
    admin-button: COMMAND_BLOCK
    prev-button: ARROW
    next-button: ARROW
    eggs-toggle: CREEPER_SPAWN_EGG
    admin-items-toggle: COMMAND_BLOCK
    blacklist-button: BLACK_WOOL
    whitelist-button: WHITE_WOOL
    upload-button: CHEST
    source-button: BOOKSHELF
    filter-button: HOPPER
    trash-button: LAVA_BUCKET
    flight-menu-button: FEATHER
    flight-toggle: FEATHER
    fly-speed-button: SUGAR
    night-vision-toggle: ENDER_EYE
    give-quick-button: KNOWLEDGE_BOOK
    fill-button: WOODEN_SHOVEL
    fill-execute-button: WOODEN_AXE
