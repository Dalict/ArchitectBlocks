# ArchitectBlocks 配置
# 作者: Dalict
# 物品列表随服务器版本自动更新，无需手动维护

settings:
  # 每次点击获取的物品数量 (1-64)
  click-amount: 64
  # 排序方式: type=按种类(同类方块聚集，接近创造栏观感) / alphabetical=按字母顺序
  sort: type
  # 分类重叠：原木/菌柄等同时出现在建筑方块和自然方块（与原版创造栏一致）
  overlap: true

# 分类开关 (对应原版创造物品栏的 10 个分类)
# 前 5 个方块类默认开启，后 5 个物品类默认关闭
categories:
  building_blocks: true      # 建筑方块
  colored_blocks: true       # 染色方块
  natural_blocks: true       # 自然方块
  functional_blocks: true    # 功能方块
  redstone_blocks: true      # 红石方块
  tools_utilities: false     # 工具与使用物品
  combat: false              # 战斗用品
  food_drinks: false         # 食物与饮品
  ingredients: false         # 原材料
  spawn_eggs: false          # 刷怪蛋

# GUI 界面配置
# 材质名使用 Material 枚举名；名称支持 & 颜色代码
gui:
  # 分类菜单尺寸 (9-54，9 的倍数)
  category-menu-size: 27
  # 物品菜单尺寸 (9-54，9 的倍数)，物品区为尺寸-9格，底排为导航
  item-menu-size: 54
  # 底排空位是否填充玻璃板
  use-pane: true
  # 分类按钮图标，key 与上方 categories 的开关名一致，留空或删掉则用内置默认
  icons:
    building_blocks: BRICKS
    colored_blocks: CYAN_WOOL
    natural_blocks: GRASS_BLOCK
    functional_blocks: OAK_SIGN
    redstone_blocks: REDSTONE
    tools_utilities: DIAMOND_PICKAXE
    combat: NETHERITE_SWORD
    food_drinks: GOLDEN_APPLE
    ingredients: IRON_INGOT
    spawn_eggs: CREEPER_SPAWN_EGG
  items:
    # 玻璃板材质
    pane: WHITE_STAINED_GLASS_PANE
    # 各按钮材质
    back-button: CLOCK
    prev-button: ARROW
    next-button: ARROW
    close-button: CLOCK
  names:
    # 分类按钮名称，可用占位符 %name%
    category: '&8[ &f%name% &8]'
    # 各按钮名称
    back: '&8[ &a返回分类菜单 &8]'
    prev: '&8[ &f上一页 &8]'
    next: '&8[ &f下一页 &8]'
    close: '&8[ &b关闭菜单 &8]'
  # 分类按钮 lore，可用占位符 %name% %count%
  category-lore:
    - '&7共 &f%count% &7种物品'
    - ''
    - '&a点击进入'

# 黑名单：生存无法获取 / 特殊物品，不在菜单中显示
# 物品名使用 Material 枚举名，见 https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
blacklist:
  - BEDROCK
  - BARRIER
  - JIGSAW
  - STRUCTURE_BLOCK
  - STRUCTURE_VOID
  - COMMAND_BLOCK
  - CHAIN_COMMAND_BLOCK
  - REPEATING_COMMAND_BLOCK
  - COMMAND_BLOCK_MINECART
  - LIGHT
  - PISTON_HEAD
  - MOVING_PISTON
  - REINFORCED_DEEPSLATE
  - DRAGON_EGG
  - SPAWNER
  - TRIAL_SPAWNER
  - VAULT
  - SUSPICIOUS_SAND
  - SUSPICIOUS_GRAVEL
  - PETRIFIED_OAK_SLAB
  - DEBUG_STICK
  - KNOWLEDGE_BOOK
  - FARMLAND
  - DIRT_PATH
  - FROSTED_ICE
  - BUDDING_AMETHYST
  - INFESTED_STONE
  - INFESTED_COBBLESTONE
  - INFESTED_STONE_BRICKS
  - INFESTED_MOSSY_STONE_BRICKS
  - INFESTED_CRACKED_STONE_BRICKS
  - INFESTED_CHISELED_STONE_BRICKS
  - INFESTED_DEEPSLATE
  - END_PORTAL_FRAME
  - TEST_BLOCK
  - TEST_INSTANCE_BLOCK
  - SCULK_SHRIEKER
  - FROGSPAWN

messages:
  title-categories: '&8材料分类'
  # 可用占位符 %category% %page% %max%
  title-items: '&8材料 » %category% %page%/%max%'
  # 可用占位符 %amount%
  item-lore: '&a点击获取 &e%amount% 个'
  no-permission: '&c你没有权限使用材料菜单！'
  reloaded: '&aArchitectBlocks 配置已重载！'
