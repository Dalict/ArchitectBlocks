# ArchitectBlocks 配置
# 作者: Dalict
# 物品列表随服务器版本自动更新
# 开关(刷怪蛋/管理员物品)、物品黑名单、玩家界面状态存储在数据库中，游戏内 /mats admin 实时管理

# 访问控制：默认 指定玩家名单 或 拥有 architectblocks.use/admin 权限 的玩家可用
access:
  # 全局允许所有人使用（开启后无视名单与权限）
  allow-everyone: false
  # 启用下方玩家名单（关闭后名单失效，仅剩权限节点判定）
  use-player-list: true
  # 可使用插件的玩家名单，也可用 /mats add|remove <玩家名> 管理（保存到本配置）
  players: []

settings:
  # 每次点击获取的物品数量 (1-64)
  click-amount: 64
  # 取物冷却（毫秒），0 = 无冷却，默认 1 秒
  give-cooldown-ms: 1000
  # 排序方式: creative=按创造物品栏顺序(物品注册序) / alphabetical=按字母顺序
  sort: creative
  # 聊天搜索输入的超时秒数，超时后会话自动失效
  chat-timeout-seconds: 30

# 数据库：开关设置、物品黑名单、玩家界面状态
database:
  # sqlite 或 mysql
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    database: architectblocks
    user: root
    password: ''
    use-ssl: false

# GUI 界面配置
# 主界面布局: 0 关闭 | 1 管理员设置(仅管理员可见) | 4 搜索时显示关键词 | 8 搜索或返回
# 底排: 45 背包已有切换 | 48 上一页 | 49 选择页码 | 50 下一页 | 53 垃圾桶
# 物品区: 9-44
gui:
  use-pane: true
  items:
    pane: WHITE_STAINED_GLASS_PANE
    close-button: BARRIER
    back-button: COMPASS
    search-button: COMPASS
    inv-button: HOPPER
    keyword-button: OAK_SIGN
    page-select-button: PAPER
    admin-button: COMMAND_BLOCK
    prev-button: ARROW
    next-button: ARROW
    eggs-toggle: SPAWNER
    admin-items-toggle: BEDROCK
    blacklist-button: BLACK_WOOL
    trash-button: LAVA_BUCKET
