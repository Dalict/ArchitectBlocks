# ArchitectBlocks 配置
# 作者: Dalict
# 物品列表随服务器版本自动更新
# 分类开关 / 物品黑白名单 / 玩家记忆页码 存储在数据库中，游戏内 /mats admin 实时管理

settings:
  # 每次点击获取的物品数量 (1-64)
  click-amount: 64
  # 取物冷却（毫秒），0 = 无冷却，默认 1 秒
  give-cooldown-ms: 1000
  # 排序方式: type=按种类(家族聚簇，接近创造栏观感) / alphabetical=按字母顺序
  sort: type
  # 分类重叠：原木/菌柄等同时出现在建筑方块和自然方块（与原版创造栏一致）
  overlap: true

# 数据库：分类开关、物品黑白名单、玩家记忆页码
database:
  # sqlite 或 mysql
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    database: architectblocks
    user: root
    password: ''
    use-ssl: false

# GUI 界面配置
# 材质名使用 Material 枚举名；名称支持 & 颜色代码
gui:
  # 分类菜单尺寸 (9-54，9 的倍数)，分类多时自动扩容
  category-menu-size: 27
  # 物品菜单尺寸 (9-54，9 的倍数)，物品区为尺寸-9格，底排为导航
  item-menu-size: 54
  # 底排空位是否填充玻璃板
  use-pane: true
  # 分类按钮图标，key 与分类开关键一致，留空或删掉则用内置默认
  icons:
    building_blocks: BRICKS
    colored_blocks: CYAN_WOOL
    natural_blocks: GRASS_BLOCK
    functional_blocks: OAK_SIGN
    redstone_blocks: REDSTONE
    tools_utilities: DIAMOND_PICKAXE
    combat: NETHERITE_SWORD
    food_drinks: GOLDEN_APPLE
    ingredients: IRON_INGOT
    spawn_eggs: CREEPER_SPAWN_EGG
  items:
    pane: WHITE_STAINED_GLASS_PANE
    back-button: CLOCK
    prev-button: ARROW
    next-button: ARROW
    close-button: CLOCK
    inv-button: HOPPER
    admin-button: COMMAND_BLOCK
    blacklist-button: BLACK_WOOL
    whitelist-button: WHITE_WOOL
    toggle-button: COMPARATOR
    admin-items-button: BEDROCK
    filter-button: HOPPER
  names:
    category: '&8[ &f%name% &8]'
    back: '&8[ &a返回分类菜单 &8]'
    back-admin: '&8[ &a返回管理主页 &8]'
    prev: '&8[ &f上一页 &8]'
    next: '&8[ &f下一页 &8]'
    close: '&8[ &b关闭菜单 &8]'
    inv: '&8[ &e获取背包已有的物品 &8]'
    admin: '&8[ &c管理员设置 &8]'
    blacklist-list: '&8[ &c物品黑名单列表 &8]'
    whitelist-list: '&8[ &f物品白名单列表 &8]'
    cats: '&8[ &6分类与功能开关 &8]'
    admin-items: '&8[ &4允许管理员物品 &8]'
  category-lore:
    - '&7共 &f%count% &7种物品'
    - ''
    - '&a点击进入'

