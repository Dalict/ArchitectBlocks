name: ArchitectBlocks
version: b1.5.0
main: com.dalict.architectblocks.ArchitectBlocks
api-version: '1.21'
author: Dalict
description: 自动检索服务器全部物品并按创造物品栏分类的材料菜单

commands:
  mats:
    description: 打开材料分类菜单
    usage: /mats [reload]
    aliases: [materials, cailiao]

permissions:
  architectblocks.use:
    description: 允许打开材料菜单并取用物品
    default: false
  architectblocks.admin:
    description: 允许重载插件配置
    default: op
